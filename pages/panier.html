<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panier - CISCK M1</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
                <span>CISCK M1</span>
            </div>
            <ul class="nav-links">
                <li><a href="../index.html">Accueil</a></li>
                <li><a href="gratuit.html">Formule Gratuite</a></li>
                <li><a href="premium.html">Formule Premium</a></li>
                <li><a href="panier.html" class="cart-link active">
                    <i class="fas fa-shopping-cart"></i> <span class="cart-count">1</span>
                </a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h1><i class="fas fa-shopping-cart"></i> Votre Panier</h1>
            <p>Simulation d'achat de l'abonnement Premium</p>
        </section>

        <section class="content-section">
            <div class="cart-summary" style="margin: 0 auto;">
                <h3>Récapitulatif</h3>
                <div class="cart-total">
                    <span>Abonnement Premium (Mensuel)</span>
                    <span class="total-amount">10€/mois</span>
                </div>

                <form class="payment-form" onsubmit="event.preventDefault(); window.location.href='confirmation.html';">
                    <h4 style="margin: 1.5rem 0 1rem;"><i class="fas fa-lock"></i> Simulation de paiement</h4>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" required placeholder="etudiant@email.com">
                    </div>

                    <div class="form-group">
                        <label>Numéro de carte</label>
                        <input type="text" id="card-number" required placeholder="1234 5678 9012 3456">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Date d'expiration</label>
                            <input type="text" id="expiry-date" placeholder="MM/AA" required>
                        </div>
                        <div class="form-group">
                            <label>CVV</label>
                            <input type="text" placeholder="123" maxlength="4" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 15px;">
                        Payer 10€ et accéder aux cours
                    </button>
                    <p style="text-align: center; margin-top: 1rem; color: #6b7280; font-size: 0.875rem;">
                        Aucun paiement réel n'est effectué.
                    </p>
                </form>
            </div>
        </section>
    </main>

    <script src="../js/main.js"></script>
</body>
</html>
